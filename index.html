<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hand-Tied Bouquet</title>
<meta name="description" content="Pull flowers out of photos, arrange them into a 3D bouquet, then wrap it with paper, ribbon and a tag.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23e58fb8'%3E%3Ccircle cx='16' cy='8' r='6'/%3E%3Ccircle cx='24' cy='14' r='6'/%3E%3Ccircle cx='21' cy='23' r='6'/%3E%3Ccircle cx='11' cy='23' r='6'/%3E%3Ccircle cx='8' cy='14' r='6'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f2c230'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=Nanum+Pen+Script&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
/* Layout: a pile of photo prints on a green worktable (left), the bouquet held up against cool shop light (right). Stacked on phones. One deliberate light look. */
:root{
  --table:#cde4a3; --table-deep:#6f8a45; --on-table:#22331a; --on-table-soft:#4c6136;
  --air:#ffffff; --ink:#16241d; --ink-soft:#4e5f57;
  --poppy:#d8412f; --poppy-deep:#b23222; --print:#fdfdfb;
  --ui:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --hand:"Nanum Pen Script","Bradley Hand","Segoe Print",cursive;
  color-scheme:light;
}
html,body{height:100%}body{margin:0}[hidden]{display:none!important}
body{background:var(--air);color:var(--ink);font-family:var(--ui);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--poppy);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(340px,39%) 1fr}

.table{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;color:var(--on-table);
  background:var(--table);
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px;padding-block:24px;gap:14px;overflow:hidden}
.head h1{margin:0;font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.025em}
.pile{position:relative;flex:1;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
.print{position:absolute;left:50%;top:50%;background:var(--print);padding:10px;box-shadow:0 1px 2px rgba(40,60,20,.22),0 16px 30px -14px rgba(40,60,20,.5);
  transition:transform .42s cubic-bezier(.3,1.1,.4,1);will-change:transform;cursor:grab}
.print.drag{transition:none;cursor:grabbing}
.print .pic{position:relative;overflow:hidden;background:#233}
.print img.photo{display:block;width:100%;height:100%;pointer-events:none;transition:filter .3s}
.print.lifting img.photo,.print.cutting img.photo{filter:brightness(.72) saturate(.75)}
.print .rm{position:absolute;right:16px;top:16px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:#22331a;font-size:20px;line-height:1}
.print:not(.top) .rm{visibility:hidden}
.print .veil{position:absolute;inset:0;background:var(--table-deep);opacity:0;transition:opacity .4s;pointer-events:none}
.hole{position:absolute;opacity:0;pointer-events:none;filter:brightness(0);transition:opacity .25s}
.hole.on{opacity:.42}
.glow{position:absolute;opacity:0;pointer-events:none;transition:opacity .18s;filter:brightness(1.08) drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 9px rgba(255,255,255,.75))}
.glow.on{opacity:1}
.pip{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border:0;padding:0;background:none;border-radius:50%;pointer-events:none;transition:opacity .25s}
.pip::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.38),0 1px 5px rgba(0,0,0,.4);animation:pip 2.8s ease-in-out infinite}
.print:not(.top) .pip,.print.lifting .pip,.print.cutting .pip,.print.drag .pip{opacity:0}
@keyframes pip{50%{transform:scale(.72);opacity:.75}}
.print canvas.loop{position:absolute;inset:0;width:100%;height:100%;display:none;cursor:crosshair}
.print.cutting canvas.loop{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.tbtn{border:1px solid rgba(34,51,26,.28);background:rgba(255,255,255,.35);border-radius:8px;height:40px;padding:0 14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.7)}
.tbtn.sq{width:40px;padding:0;justify-content:center}
.tbtn.on{background:var(--on-table);color:#fff}
.count{font-variant-numeric:tabular-nums;color:var(--on-table-soft);min-width:52px;text-align:center}
.table.dropping::after{content:"Drop your photos here";position:absolute;inset:12px;border:2px dashed var(--on-table);border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:700;background:rgba(205,228,163,.92);z-index:300}

.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--air)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.turning{cursor:grabbing}
.hint{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--hand);font-size:32px;color:var(--ink-soft);text-align:center;pointer-events:none;transition:opacity .4s;width:80%}
.dock{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 16px;pointer-events:none}
.dock>*{pointer-events:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:100%}
.sbtn{border:0;height:44px;border-radius:10px;padding:0 16px;font-weight:500;background:#fff;box-shadow:0 0 0 1px rgba(22,36,29,.1),0 8px 22px -14px rgba(22,36,29,.45);white-space:nowrap}
.sbtn:hover:not(:disabled){background:#f4f7f7}
.sbtn:disabled{opacity:.45;cursor:default}
.sbtn.go{background:var(--poppy);color:#fff;font-weight:700;padding:0 24px}
.sbtn.go:hover:not(:disabled){background:var(--poppy-deep)}
.finish{background:rgba(255,255,255,.94);border:1px solid rgba(22,36,29,.09);border-radius:12px;padding:8px 12px;box-shadow:0 8px 26px -14px rgba(22,36,29,.6);gap:8px 18px}
.grp{display:flex;gap:6px;align-items:center}
.chip{border:1px solid transparent;background:none;border-radius:7px;height:36px;padding:0 10px;color:var(--ink-soft)}
.chip[aria-pressed=true]{border-color:var(--ink);color:var(--ink);font-weight:500}
.sw{width:36px;height:36px;padding:0;border:0;background:none;border-radius:50%;display:grid;place-items:center}
.sw i{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw[aria-pressed=true] i{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.note{font-family:var(--hand);font-size:22px;border:0;border-bottom:1.5px solid var(--ink-soft);background:none;width:130px;height:34px;padding:0 2px;border-radius:0}
.msg{position:absolute;left:50%;top:22px;transform:translate(-50%,-14px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 48px);text-align:center;box-sizing:border-box}
.msg.on{opacity:1;transform:translate(-50%,0)}
.lift{position:fixed;left:0;top:0;z-index:400;pointer-events:none;will-change:transform;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 18px 16px rgba(10,30,20,.32))}
.lift img{width:100%;height:100%;display:block;max-width:none}
.veilload{position:absolute;inset:0;background:var(--air);transition:opacity .6s;pointer-events:none}
.veilload.done{opacity:0}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,55%) minmax(0,45%)}
  .stage{order:1}.table{order:2;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
  .head{display:none}
  .print{padding:6px}
  .tbtn{height:36px;padding:0 10px;font-size:13px}.tbtn.sq{width:36px}.count{min-width:44px;font-size:13px}.bar{flex-wrap:nowrap;gap:6px}
  .dock{bottom:10px;gap:6px}.sbtn{height:40px;padding:0 12px;font-size:14px}.finish{padding:4px 8px;gap:2px 8px}.chip{height:32px;padding:0 7px;font-size:13px}.sw{width:28px;height:32px}.sw i{width:18px;height:18px}.note{width:88px;font-size:19px;height:28px}
}
@media (prefers-reduced-motion:reduce){.pip::after{animation:none}.print{transition-duration:.01s}}
</style>
</head>
<body>

<div class="app">
  <section class="table" id="table" aria-label="Your photos">
    <div class="head"><h1>Hand-Tied</h1></div>
    <div class="pile" id="pile"></div>
    <div class="bar">
      <button class="tbtn sq" id="prevBtn" aria-label="Previous photo">&#8592;</button>
      <span class="count" id="count"></span>
      <button class="tbtn sq" id="nextBtn" aria-label="Next photo">&#8594;</button>
      <button class="tbtn" id="cutBtn">Cut out</button>
      <button class="tbtn" id="addBtn">Add photos</button>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>
  </section>
  <section class="stage" id="stage" aria-label="Your bouquet">
    <canvas id="gl" tabindex="0" aria-label="Bouquet. Drag or use arrow keys to turn it."></canvas>
    <div class="hint" id="hint">bring a flower over here</div>
    <div class="msg" id="msg" role="status"></div>
    <div class="dock">
      <div class="row finish" id="finish" hidden>
        <div class="grp" id="papers" role="group" aria-label="Paper"></div>
        <div class="grp" id="ribbons" role="group" aria-label="Ribbon"></div>
        <input class="note" id="note" maxlength="22" placeholder="write a tag" aria-label="Words on the gift tag">
      </div>
      <div class="row">
        <button class="sbtn" id="undoBtn">Undo</button>
        <button class="sbtn" id="clearBtn">Start over</button>
        <button class="sbtn go" id="wrapBtn">Wrap it</button>
        <button class="sbtn" id="saveBtn" hidden>Save picture</button>
      </div>
    </div>
    <div class="veilload" id="veil"></div>
  </section>
</div>

<script src="photos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v,a=0,b=1) => Math.min(b,Math.max(a,v));
const mix = (a,b,t) => a+(b-a)*t;
const sstep = (a,b,x) => { const t=clamp((x-a)/(b-a)); return t*t*(3-2*t); };
const V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const GOLD = Math.PI*(3-Math.sqrt(5));
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
function rng(seed){ let s=seed>>>0; return () => { s=(s+0x6D2B79F5)>>>0; let t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function mk(w,h){ const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h)); return [c,c.getContext('2d',{willReadFrequently:false})]; }
let msgT; function say(t){ $('msg').textContent=t; $('msg').classList.add('on'); clearTimeout(msgT); msgT=setTimeout(()=>$('msg').classList.remove('on'),2600); }

function bboxOf(c){ const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data; let x0=w,y0=h,x1=0,y1=0; for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2) if(d[(y*w+x)*4+3]>24){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } return [Math.max(0,x0-3),Math.max(0,y0-3),Math.min(w,x1+4),Math.min(h,y1+4)]; }
/* your photos and their cut-outs live in photos.js */
async function loadCanvas(u){ const i=new Image(); await new Promise((ok,no)=>{ i.onload=ok; i.onerror=no; i.src=u; }); const [c,g]=mk(i.naturalWidth,i.naturalHeight); g.drawImage(i,0,0); return c; }
async function loadPhotos(){ return Promise.all((window.PHOTOS||[]).map(async p=>({canvas:await loadCanvas(p.src),src:p.src,cap:p.alt,own:true,flowers:await Promise.all(p.flowers.map(async f=>({...f,key:f.id,cut:await loadCanvas(f.src)})))}))); }

/* =====================================================================
   PRINTS
   ===================================================================== */
const prints=[]; let top=0, ready=false, uid=0;
const pile=$('pile');
function makeFlower(f,print){
  const c=f.cut, g=c.getContext('2d'), aw=Math.max(8,Math.round(c.width/3)), ah=Math.max(8,Math.round(c.height/3)), [s,sg]=mk(aw,ah);
  sg.drawImage(c,0,0,aw,ah); const d=sg.getImageData(0,0,aw,ah).data, a=new Uint8Array(aw*ah); let R=0,G=0,B=0,n=0;
  for(let i=0;i<a.length;i++){ a[i]=d[i*4+3]; if(a[i]>200){ R+=d[i*4]; G+=d[i*4+1]; B+=d[i*4+2]; n++; } }
  n=n||1;
  return {...f,id:'f'+(uid++),url:f.src||c.toDataURL('image/png'),alpha:{w:aw,h:ah,a},avg:new THREE.Color().setRGB(R/n/255,G/n/255,B/n/255,THREE.SRGBColorSpace),print};
}
function addPrint(p,at){
  const el=document.createElement('div'); el.className='print';
  el.innerHTML='<div class="pic"><img class="photo" alt="" draggable="false"><img class="hole" alt="" draggable="false"><img class="glow" alt="" draggable="false"><canvas class="loop"></canvas></div><button class="rm" aria-label="Remove this photo" title="Remove this photo" hidden>&#215;</button><div class="veil"></div>';
  const ph=el.querySelector('.photo'); ph.alt='Photo'+(p.cap?': '+p.cap:''); ph.src=p.src||p.canvas.toDataURL('image/jpeg',.9);
  p.el=el; p.pic=el.querySelector('.pic'); p.hole=el.querySelector('.hole'); p.glow=el.querySelector('.glow'); p.loop=el.querySelector('.loop'); p.ar=p.canvas.width/p.canvas.height; p.tw=((uid*37)%11-5)*.75; uid++;
  const rm=el.querySelector('.rm'); if(p.key){ rm.hidden=false; rm.addEventListener('pointerdown',e=>e.stopPropagation()); rm.onclick=()=>removePrint(p); }
  const raw=p.flowers||[]; p.flowers=[]; raw.forEach(f=>addFlowerTo(p,f));
  pile.appendChild(el); at==null?prints.push(p):prints.splice(at,0,p); wirePrint(p); return p;
}
function addFlowerTo(p,f){
  const fl=makeFlower(f,p); p.flowers.push(fl);
  const b=document.createElement('button'); b.className='pip'; b.setAttribute('aria-label','Add '+fl.name+' to the bouquet'); b.style.left=(fl.x+fl.cx*fl.w)*100+'%'; b.style.top=(fl.y+fl.cy*fl.h)*100+'%';
  b.addEventListener('click',e=>{ if(e.detail===0) quick(fl); }); p.pic.appendChild(b); return fl;
}
function layPile(){
  const W=pile.clientWidth, H=pile.clientHeight, small=innerWidth<=820, pad=small?6:10, cap=pad;
  prints.forEach(p=>{ let h=Math.min(H-60-cap-pad,(W*(small?.6:.84))/p.ar), w=h*p.ar; if(w>W*.86){ w=W*.86; h=w/p.ar; } p.w=w+pad*2; p.h=h+pad+cap; p.pic.style.width=w+'px'; p.pic.style.height=h+'px'; p.el.style.marginLeft=-p.w/2+'px'; p.el.style.marginTop=-p.h/2+'px'; });
  stack();
}
function stack(){
  const N=prints.length; prints.forEach((p,i)=>{ const k=((i-top)%N+N)%N; p.k=k; p.el.classList.toggle('top',k===0); p.el.style.zIndex=String(100-k);
    p.el.querySelectorAll('.pip').forEach(b=>b.tabIndex=k===0?0:-1);
    const r=k===0?p.tw*.18:p.tw+(k%2?1:-1)*(2+k*.6), x=k===0?0:(k%2?1:-1)*Math.min(k,4)*9, y=k===0?0:-Math.min(k,4)*4;
    p.el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg)`; p.el.style.visibility=k>5?'hidden':'visible'; p.el.querySelector('.veil').style.opacity=k===0?0:Math.min(.42,.1+k*.07); });
  $('count').textContent=N?`${top+1} of ${N}`:'';
}
let flipping=false;
function flip(dir,fromX=0){
  if(flipping||prints.length<2) return; endCut(); flipping=true;
  const N=prints.length, p=dir>0?prints[top]:prints[(top-1+N)%N], side=fromX?Math.sign(fromX):(dir>0?-1:1);
  const out=`translate(${side*(p.w*.75+60)}px,-14px) rotate(${side*9}deg)`;
  if(dir>0){ p.el.style.transform=out; setTimeout(()=>{ top=(top+1)%N; stack(); flipping=false; },calm?10:210); }
  else { p.el.style.transform=out; setTimeout(()=>{ top=(top-1+N)%N; stack(); flipping=false; },calm?10:210); }
}
function show(i){ endCut(); top=i; stack(); }
$('nextBtn').onclick=()=>flip(1); $('prevBtn').onclick=()=>flip(-1);
addEventListener('keydown',e=>{ if(e.target===$('gl')||/INPUT/.test(e.target.tagName)) return; if(e.key==='ArrowRight') flip(1); if(e.key==='ArrowLeft') flip(-1); if(e.key==='Escape') endCut(); });

/* local (unrotated) coordinates of a pointer inside a print's picture */
function local(p,e){ const r=p.pic.getBoundingClientRect(), a=-p.tw*.18*Math.PI/180, cx=r.left+r.width/2, cy=r.top+r.height/2, dx=e.clientX-cx, dy=e.clientY-cy, w=p.pic.offsetWidth,h=p.pic.offsetHeight; return [(dx*Math.cos(a)-dy*Math.sin(a))/w+.5,(dx*Math.sin(a)+dy*Math.cos(a))/h+.5]; }
function hit(p,nx,ny){
  let best=null,ba=9; for(const f of p.flowers){ const u=(nx-f.x)/f.w,v=(ny-f.y)/f.h; if(u<0||v<0||u>=1||v>=1) continue; const A=f.alpha; if(A.a[Math.floor(v*A.h)*A.w+Math.floor(u*A.w)]>70){ const ar=f.w*f.h; if(ar<ba){ ba=ar; best=f; } } }
  if(best) return best;
  let bd=.05; for(const f of p.flowers){ const d=Math.hypot(nx-(f.x+f.cx*f.w),ny-(f.y+f.cy*f.h)); if(d<bd+Math.min(f.w,f.h)*.18){ bd=d; best=f; } } return best;
}
function over(el,f){ el.src=f.url; el.style.left=f.x*100+'%'; el.style.top=f.y*100+'%'; el.style.width=f.w*100+'%'; el.style.height=f.h*100+'%'; el.style.maxWidth='none'; }
function wirePrint(p){
  let sw=null, hov=null;
  p.el.addEventListener('pointerdown',e=>{
    if(e.button>0||p.k!==0||flipping||!ready||cutting) return;
    const [nx,ny]=local(p,e), f=nx>=0&&ny>=0&&nx<=1&&ny<=1?hit(p,nx,ny):null;
    e.preventDefault();
    if(f){ p.glow.classList.remove('on'); startLift(f,e); return; }
    sw={x:e.clientX,y:e.clientY,id:e.pointerId,dx:0}; p.el.setPointerCapture(e.pointerId); p.el.classList.add('drag');
  });
  p.el.addEventListener('pointermove',e=>{
    if(sw&&e.pointerId===sw.id){ sw.dx=e.clientX-sw.x; p.el.style.transform=`translate(${sw.dx}px,${(e.clientY-sw.y)*.25}px) rotate(${sw.dx*.035}deg)`; return; }
    if(p.k!==0||lift||cutting||e.pointerType!=='mouse') return;
    const [nx,ny]=local(p,e), f=hit(p,nx,ny); if(f!==hov){ hov=f; if(f) over(p.glow,f); p.glow.classList.toggle('on',!!f); }
  });
  p.el.addEventListener('pointerleave',()=>{ hov=null; p.glow.classList.remove('on'); });
  const end=e=>{ if(!sw||e.pointerId!==sw.id) return; const dx=sw.dx; sw=null; p.el.classList.remove('drag'); void p.el.offsetWidth; Math.abs(dx)>60&&prints.length>1?flip(1,dx):stack(); };
  p.el.addEventListener('pointerup',end); p.el.addEventListener('pointercancel',end);
  wireLoop(p);
}

/* =====================================================================
   CUT OUT A FLOWER: circle it, and it is separated from its background
   ===================================================================== */
let cutting=null;
function startCut(){ const p=prints[top]; if(!p) return; cutting=p; p.el.classList.add('cutting'); $('cutBtn').classList.add('on'); $('cutBtn').textContent='Cancel'; say('Draw a loop around one flower, just outside the petals'); const d=Math.min(devicePixelRatio,2); p.loop.width=p.pic.offsetWidth*d; p.loop.height=p.pic.offsetHeight*d; }
function endCut(){ if(!cutting) return; cutting.el.classList.remove('cutting'); cutting=null; $('cutBtn').classList.remove('on'); $('cutBtn').textContent='Cut out'; }
$('cutBtn').onclick=()=>cutting?endCut():startCut();
function wireLoop(p){

/* tag */

/* =====================================================================
   LIFT: pulling a flower out of a print
   ===================================================================== */
let lift=null;
function liftEl(f,w,h){ const el=document.createElement('div'); el.className='lift'; el.style.width=w+'px'; el.style.height=h+'px'; const i=document.createElement('img'); i.src=f.url; i.alt=''; el.appendChild(i); document.body.appendChild(el); return el; }
function rectOf(f){ const p=f.print, r=p.pic.getBoundingClientRect(), w=p.pic.offsetWidth, h=p.pic.offsetHeight, a=p.tw*.18*Math.PI/180, dx=(f.x+f.w/2-.5)*w, dy=(f.y+f.h/2-.5)*h; return {cx:r.left+r.width/2+dx*Math.cos(a)-dy*Math.sin(a),cy:r.top+r.height/2+dx*Math.sin(a)+dy*Math.cos(a),w:f.w*w,h:f.h*h}; }

/* =====================================================================

   ===================================================================== */

  if(!turn){ if(yawG!=null){ yawV=(yawG-yaw)*4; if(Math.abs(yawG-yaw)<.003) yawG=null; } else yawV*=Math.exp(-2*dt); yaw+=yawV*dt; pitch=mix(pitch,pitchG,1-Math.exp(-1.2*dt)); }

}
/* boot */

  const all={}; prints.forEach(p=>p.flowers.forEach(f=>{ if(f.key) all[f.key]=f; }));
  const st=[['rho1',.04,1.4,.8],['clem1',-.56,1.4,.55],['rose3',.6,1.2,.6],['fmn2',-.12,.96,.82],['broom2',-.7,1.72,.05],['notro1',.5,1.85,-.1],['rose4',-.62,1,.5],['clem2',.28,1.82,.25],['lup4',-.12,1.9,-.25],['fmn4',.5,.86,.66],['vetch1',.86,1.5,.1],['rho2',-.28,1.75,.2],['leaf',.2,1.8,-.5]];

}
setTimeout(boot,30);
})();
